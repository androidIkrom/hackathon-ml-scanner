plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'androidx.navigation.safeargs.kotlin'
    id 'de.undercouch.download'
}

// Walk-mode routing key (openrouteservice). Read from the git-ignored local.properties; empty = beacon only.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.nungil'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nungil'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'ORS_API_KEY', "\"${localProps.getProperty('ORS_API_KEY', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    androidResources {
        // MediaPipe memory-maps models from assets; compressed assets cannot be mapped.
        noCompress 'tflite', 'task'
    }
    sourceSets {
        main {
            // One resource folder per owner, so nobody edits another person's XML.
            res.srcDirs = ['src/main/res-a', 'src/main/res-i', 'src/main/res-y']
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Models are downloaded at build time and never committed. -PskipModels skips it (CI unit tests).
def assetDir = file("$projectDir/src/main/assets")
def models = [
    'efficientdet-lite2.tflite'     : 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float32/1/efficientdet_lite2.tflite',
    'efficientdet-lite0.tflite'     : 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite',
    'ssd-mobilenet-v2.tflite'       : 'https://storage.googleapis.com/mediapipe-models/object_detector/ssd_mobilenet_v2/float32/1/ssd_mobilenet_v2.tflite',
    'efficientdet-lite0-int8.tflite': 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite',
    'efficientnet-lite0.tflite'     : 'https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/float32/1/efficientnet_lite0.tflite',
    'mobilenet_v3_small.tflite'     : 'https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/1/mobilenet_v3_small.tflite',
    'magic_touch.tflite'            : 'https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite',
    'facenet_512.tflite'            : 'https://raw.githubusercontent.com/shubham0204/FaceRecognition_With_FaceNet_Android/master/app/src/main/assets/facenet_512.tflite',
]
def downloadTasks = models.collect { fileName, url ->
    tasks.register("download_" + fileName.replaceAll('[^A-Za-z0-9]', '_'), de.undercouch.gradle.tasks.download.Download) {
        src url
        dest new File(assetDir, fileName)
        overwrite false
    }
}
if (!project.hasProperty('skipModels')) {
    tasks.named('preBuild') { dependsOn downloadTasks }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.9'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.9'

    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'

    implementation 'com.google.mediapipe:tasks-vision:1.0.0'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.ar:core:1.49.0'

    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    kapt 'androidx.room:room-compiler:2.7.2'

    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub on the JVM; route parsing tests need the real one.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.room:room-testing:2.7.2'
}
