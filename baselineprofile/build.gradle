plugins {
    id 'com.android.test'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.baselineprofile'
}

// Makes the app's Baseline Profile: `gradlew :app:generateReleaseBaselineProfile` with a phone or an emulator
// (Android 13 or later) connected. The profile goes to app/src/release/generated/baselineProfiles and is built into
// the release APK; ART compiles those classes ahead of time, so the app opens faster.
android {
    namespace 'com.nungil.baselineprofile'
    compileSdk 35

    defaultConfig {
        minSdk 28
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    targetProjectPath ':app'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

baselineProfile {
    useConnectedDevices = true
}

dependencies {
    implementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.4.1'
}
